cluster: workload-prod-local
extraObjects:
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: analysis-monitoring-view-petclinic
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: cluster-monitoring-view
    subjects:
      - kind: ServiceAccount
        name: default
        namespace: petclinic-dev
      - kind: ServiceAccount
        name: default
        namespace: petclinic-stage
      - kind: ServiceAccount
        name: default
        namespace: petclinic-prod
